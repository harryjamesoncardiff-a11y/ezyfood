<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hot Food Manager V5</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:Arial;margin:12px;background:#f4f4f4} .card{background:#fff;padding:12px;border-radius:8px;margin:10px 0}.seat{width:42px;height:42px;border:none;border-radius:6px;margin:2px}.empty{background:#ddd}.selected{background:#2196F3;color:#fff}.pending{background:#FF9800;color:#fff}.served{background:#4CAF50;color:#fff}.row{display:flex;align-items:center}.aisle{width:18px} #seatMap{max-height:450px;overflow:auto} button,input{padding:8px;margin:4px} textarea{width:100%;height:220px}</style></head><body><h1>🍔 Hot Food Manager V5</h1><div class='card'><input id='flightNo' placeholder='Flight Number'><input id='route' placeholder='Route'><button onclick='saveFlight()'>Save</button></div><div class='card'><h3>Menu</h3><input id='foodName' placeholder='Food'><input id='foodStock' type='number' placeholder='Stock'><button onclick='addFood()'>Add</button><div id='foodButtons'></div></div><div class='card'><h3>Seat Map</h3><b id='selectedSeat'>None</b><div id='seatMap'></div></div><div class='card'><input id='qty' type='number' value='1'><button onclick='addOrder()'>Add Order</button><button onclick='newFlight()'>New Flight</button></div><div class='card'><button onclick="filterZone('ALL')">All</button><button onclick="filterZone('A')">Zone A</button><button onclick="filterZone('B')">Zone B</button><button onclick="filterZone('C')">Zone C</button><button onclick="filterZone('D')">Zone D</button></div><div class='card'><h3>Passenger Summary</h3><div id='summary'></div></div><div class='card'><h3>Cook Totals</h3><div id='totals'></div></div><div class='card'><h3>Crew List</h3><textarea id='crew'></textarea><button onclick='pdf()'>Export PDF</button></div><script>let menu=JSON.parse(localStorage.menu||'[]');let orders=JSON.parse(localStorage.orders||'[]');let selectedFood=null,selectedSeatCode='',zone='ALL';function save(){localStorage.menu=JSON.stringify(menu);localStorage.orders=JSON.stringify(orders)}function saveFlight(){localStorage.flightNo=flightNo.value;localStorage.route=route.value}flightNo.value=localStorage.flightNo||'';route.value=localStorage.route||'';function addFood(){menu.push({id:Date.now(),name:foodName.value,stock:+foodStock.value});save();render()}function foodRemain(id){let m=menu.find(x=>x.id===id);let u=orders.filter(o=>o.itemId===id).reduce((a,b)=>a+b.qty,0);return m.stock-u}function pickFood(id){selectedFood=id}function pickSeat(s){selectedSeatCode=s;selectedSeat.innerText=s;renderSeats()}function addOrder(){if(!selectedSeatCode||!selectedFood)return;let q=+qty.value;let ex=orders.find(o=>o.seat===selectedSeatCode&&o.itemId===selectedFood);if(ex)ex.qty+=q;else orders.push({id:Date.now(),seat:selectedSeatCode,itemId:selectedFood,qty:q,served:false});save();render()}function renderSeats(){let h='';for(let r=1;r<=40;r++){h+='<div class=row>';['A','B','C','D','E','F'].forEach(l=>{let s=r+l,c='empty';let o=orders.filter(x=>x.seat===s);if(o.length)c=o.every(x=>x.served)?'served':'pending';if(selectedSeatCode===s)c='selected';h+=`<button class="seat ${c}" onclick="pickSeat('${s}')">${s}</button>`;if(l==='C')h+='<div class=aisle></div>'});h+='</div>';}seatMap.innerHTML=h}function filterZone(z){zone=z;render()}function render(){foodButtons.innerHTML='';menu.forEach(m=>foodButtons.innerHTML+=`<button onclick="pickFood(${m.id})">${m.name} (${foodRemain(m.id)})</button>`);renderSeats();let g={},t={};orders.forEach(o=>{let m=menu.find(x=>x.id===o.itemId);if(!g[o.seat])g[o.seat]=[];g[o.seat].push(m.name+' x'+o.qty);t[m.name]=(t[m.name]||0)+o.qty});summary.innerHTML=Object.keys(g).sort().map(s=>'<p><b>'+s+'</b><br>'+g[s].join('<br>')+'</p>').join('');totals.innerHTML=Object.keys(t).map(k=>k+' x '+t[k]).join('<br>');let A=[],B=[],C=[],D=[];Object.keys(g).forEach(s=>{let r=parseInt(s);let line=s+' - '+g[s].join(', ');if(r<=10)A.push(line);else if(r<=20)B.push(line);else if(r<=30)C.push(line);else D.push(line)});crew.value='ZONE A
'+A.join('
')+'

ZONE B
'+B.join('
')+'

ZONE C
'+C.join('
')+'

ZONE D
'+D.join('
')}function pdf(){const {jsPDF}=window.jspdf;let d=new jsPDF();d.text('Hot Food Sheet',10,10);d.text('Flight '+(localStorage.flightNo||''),10,20);d.text(crew.value,10,30);d.save('cook-sheet.pdf')}function newFlight(){orders=[];save();render()}render();</script></body></html>
